name: Chrome extension release

on:
  workflow_dispatch:
  push:
    tags:
      - "chrome-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck extension
        run: npm run extension:typecheck
      - name: Test extension
        run: npm run extension:test
      - name: Build extension
        run: npm run extension:build
      - name: Package tagged version
        if: startsWith(github.ref, 'refs/tags/chrome-v')
        run: python3 scripts/package_extension.py --expect-version "${GITHUB_REF_NAME#chrome-v}"
      - name: Package manual build
        if: ${{ !startsWith(github.ref, 'refs/tags/chrome-v') }}
        run: python3 scripts/package_extension.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: seo-workbench-chrome
          path: dist/releases/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/chrome-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/* --verify-tag --generate-notes --title "SEO Workbench Chrome ${GITHUB_REF_NAME#chrome-v}"

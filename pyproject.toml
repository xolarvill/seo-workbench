[project]
name = "seo-workbench"
version = "0.2.0"
description = "Agent-neutral SEO workflow and audit tools."
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
seo-workbench = "seo_workbench.cli:main"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project.optional-dependencies]
rendered = [
    "playwright>=1.53.0",
]
technology = [
    "wappalyzer==2.0.2",
]
google = [
    "google-auth>=2.40.0,<3",
    "google-auth-oauthlib>=1.2.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pyyaml>=6.0.2,<7",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["seo_workbench", "seo_workbench_tools"]

[tool.hatch.build.targets.sdist]
include = [
    "seo_workbench/",
    "seo_workbench_tools/",
    "skills/",
    "templates/",
    "workflows/",
    "AGENTS.md",
    "README.md",
]

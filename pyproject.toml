[project]
name = "seo-workbench"
version = "0.2.0"
description = "Agent-neutral SEO workflow and audit tools."
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
rendered = [
    "playwright>=1.53.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"
